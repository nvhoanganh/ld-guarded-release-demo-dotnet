# OpenTelemetry Collector config — fans out traces, metrics, logs from the
# .NET app to both LaunchDarkly and New Relic.
#
# Required env vars:
#   LD_SDK_KEY                — LaunchDarkly server-side SDK key
#   NEW_RELIC_LICENSE_KEY     — New Relic ingest license key
#
# Run with:
#   otelcol-contrib --config=otel-collector-config.yaml

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 8192

  # LaunchDarkly's collector identifies the project from this resource
  # attribute. Set here so the SDK key never sits in the app config.
  resource/launchdarkly:
    attributes:
      - key: launchdarkly.project_id
        value: ${env:LD_SDK_KEY}
        action: upsert

exporters:
  otlp_http/launchdarkly:
    endpoint: https://otel.observability.app.launchdarkly.com:4318

  # New Relic OTLP — change to https://otlp.eu01.nr-data.net for EU.
  otlp_http/newrelic:
    endpoint: https://otlp.nr-data.net
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [resource/launchdarkly, batch]
      exporters:  [otlp_http/launchdarkly, otlp_http/newrelic]
    metrics:
      receivers:  [otlp]
      processors: [resource/launchdarkly, batch]
      exporters:  [otlp_http/launchdarkly, otlp_http/newrelic]
    logs:
      receivers:  [otlp]
      processors: [resource/launchdarkly, batch]
      exporters:  [otlp_http/launchdarkly, otlp_http/newrelic]
